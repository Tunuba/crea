<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crea su página</title>
<meta name="description" content="Pegue los tres códigos de su página y véala funcionar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff3d7f'/%3E%3Ccircle cx='11' cy='11' r='4' fill='white' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --fondo: #fff8ef; --tarjeta: #fff; --texto: #24183a; --suave: #6b5d80; --naranja: #ff9a3d; --azul: #3d5afe; --morado: #8b3dff; --verde: #12b886; --rosa: #ff3d7f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fondo: #140f22; --tarjeta: #1f1833; --texto: #f4eefe; --suave: #b6a8cc; } }
  :root[data-theme="dark"] { --fondo: #140f22; --tarjeta: #1f1833; --texto: #f4eefe; --suave: #b6a8cc; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.4 Nunito, "Segoe UI", system-ui, sans-serif; }
  header { background: linear-gradient(120deg, var(--morado), var(--rosa) 60%, var(--naranja)); color: #fff; padding: 12px 16px; text-align: center; }
  header h1 { margin: 0; font: 800 clamp(26px, 5vw, 38px)/1.1 "Baloo 2", Nunito, sans-serif; }
  main { max-width: 1300px; margin: 0 auto; padding: 14px 16px 24px; }
  .cajas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .caja b { display: block; color: #fff; font: 800 20px "Baloo 2", Nunito, sans-serif; padding: 6px 14px; border-radius: 14px 14px 0 0; }
  .caja textarea { width: 100%; height: 30vh; min-height: 160px; font: 13px/1.45 Consolas, "Cascadia Mono", monospace; white-space: pre; tab-size: 2;
                   border: 3px solid; border-top: 0; border-radius: 0 0 14px 14px; padding: 10px; background: var(--tarjeta); color: var(--texto); resize: vertical; }
  .caja textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(61, 90, 254, .3); }
  .rotulo { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 16px 0 6px; flex-wrap: wrap; }
  .rotulo b { font: 800 22px "Baloo 2", Nunito, sans-serif; }
  .marco { border: 3px solid var(--verde); border-radius: 18px; overflow: hidden; background: #fff; height: 62vh; min-height: 300px; }
  .marco iframe { width: 100%; height: 100%; border: 0; display: block; }
  button { border: none; border-radius: 12px; padding: 9px 16px; font: 700 16px Nunito, sans-serif; cursor: pointer; color: #fff; background: var(--verde); }
  button.gris { background: var(--suave); }
  @media (max-width: 760px) { .cajas { grid-template-columns: 1fr; } .caja textarea { height: 22vh; } .marco { height: 70vh; } }
</style>
</head>
<body>
<header><h1>Crea su página</h1></header>
<main>
  <div class="cajas">
    <label class="caja"><b style="background:var(--naranja)">clase.html</b><textarea id="html" spellcheck="false" style="border-color:var(--naranja)" placeholder="Pegue aquí el código de clase.html"></textarea></label>
    <label class="caja"><b style="background:var(--azul)">clase.css</b><textarea id="css" spellcheck="false" style="border-color:var(--azul)" placeholder="Pegue aquí el código de clase.css"></textarea></label>
    <label class="caja"><b style="background:var(--morado)">clase.js</b><textarea id="js" spellcheck="false" style="border-color:var(--morado)" placeholder="Pegue aquí el código de clase.js"></textarea></label>
  </div>
  <div class="rotulo">
    <b>Su página</b>
    <span><button id="grande">Pantalla completa</button> <button class="gris" id="borrar">Borrar todo</button></span>
  </div>
  <div class="marco"><iframe id="vista" sandbox="allow-scripts allow-modals allow-forms" title="Su página"></iframe></div>
</main>
<script>
const $ = id => document.getElementById(id);
const CLAVE = 'crea-su-pagina.v2';

// Junta los tres archivos en una sola pagina. Sirve aunque peguen todo en una sola caja.
function juntar() {
  let html = $('html').value, css = $('css').value, js = $('js').value;
  html = html.replace(/<link[^>]*href=["']?[^"'>]*\.css["']?[^>]*>/gi, '')
             .replace(/<script[^>]*src=["']?[^"'>]*\.js["']?[^>]*>\s*<\/script>/gi, '');
  if (!/<html|<body/i.test(html)) html = `<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>${html}</body></html>`;
  const estilo = `<style>${css}</style>`, guion = '<script>' + js.replace(/<\/script/gi, '<\\/script') + '<' + '/script>';
  html = /<\/head>/i.test(html) ? html.replace(/<\/head>/i, estilo + '</head>') : estilo + html;
  html = /<\/body>/i.test(html) ? html.replace(/<\/body>(?![\s\S]*<\/body>)/i, guion + '</body>') : html + guion;
  return html;
}

// Si pegan la respuesta entera de la IA, cada bloque de codigo va a su caja
function repartir(texto) {
  const bloques = [...texto.matchAll(/```\s*([a-zA-Z]*)[^\n]*\n([\s\S]*?)```/g)];
  if (!bloques.length) return false;
  for (const [, tipo, codigo] of bloques) {
    const t = tipo.toLowerCase();
    let destino = t === 'css' ? 'css' : /^(js|javascript)$/.test(t) ? 'js' : /html|xml/.test(t) ? 'html' : null;
    if (!destino) destino = /<\w+[\s>]/.test(codigo) ? 'html' : /function|=>|document\.|let |const /.test(codigo) ? 'js' : 'css';
    $(destino).value = codigo.trim();
  }
  return true;
}

let espera = null;
function ver() {
  $('vista').srcdoc = juntar();
  try { localStorage.setItem(CLAVE, JSON.stringify({ html: $('html').value, css: $('css').value, js: $('js').value })); } catch (e) {}
}
for (const id of ['html', 'css', 'js']) {
  $(id).addEventListener('input', () => { clearTimeout(espera); espera = setTimeout(ver, 500); });
  $(id).addEventListener('paste', e => {
    const t = (e.clipboardData || window.clipboardData).getData('text');
    if (repartir(t)) { e.preventDefault(); ver(); }
  });
}
$('grande').onclick = () => { const f = $('vista'); (f.requestFullscreen || f.webkitRequestFullscreen || (() => {})).call(f); };
$('borrar').onclick = () => { $('html').value = $('css').value = $('js').value = ''; ver(); };

try { const g = JSON.parse(localStorage.getItem(CLAVE)); if (g) { $('html').value = g.html || ''; $('css').value = g.css || ''; $('js').value = g.js || ''; } } catch (e) {}
ver();
</script>
</body>
</html>
